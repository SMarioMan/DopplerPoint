[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dopplerpoint"
version = "0.1.0"
description = "Local aircraft Doppler curve analysis and candidate search"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
license = "MIT"

[project.optional-dependencies]
terrain = ["rasterio>=1.3,<2"]

[project.scripts]
dopplerpoint = "dopplerpoint.cli:main"

[tool.setuptools.package-data]
dopplerpoint = ["web/*.html"]

[tool.setuptools.packages.find]
include = ["dopplerpoint*"]
